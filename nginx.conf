# /etc/nginx/sites-available/portfolio.remorac.com
# Static site config for habiburrahman portfolio
# HTTP only — run `sudo certbot --nginx -d portfolio.remorac.com` later to add TLS.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.remorac.com;

    root /var/www/portfolio.remorac.com;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Logs
    access_log /var/log/nginx/portfolio.remorac.com.access.log;
    error_log  /var/log/nginx/portfolio.remorac.com.error.log;

    # Cache hashed/static assets aggressively
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # HTML — short cache so updates roll out quickly
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files (.git, .env, .DS_Store, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Don't serve markdown source files
    location ~* \.(md|markdown)$ {
        deny all;
    }

    # Custom error pages (optional — fall back to nginx defaults if absent)
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
